body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #111a2e, #05070f);
    color: white;
    text-align: center;
}

.container {
    padding: 140px 40px;
}

h1 {
    font-size: 3.5rem;
    margin-bottom: 40px;
    letter-spacing: 2px;
    text-shadow: 0 0 25px rgba(0,255,200,0.4);
}

.subtitle {
    margin: 40px auto 120px;
    font-size: 1.3rem;
    line-height: 2.2;
    max-width: 700px;
    opacity: 0.85;
}

.logo {
    width: 240px;
    margin: 120px auto;
    filter: drop-shadow(0 0 25px rgba(0,255,200,0.5));
}

.dex-runner {
    overflow: hidden;
    white-space: nowrap;
    margin: 160px 0;
}

.dex-track {
    display: inline-block;
    animation: moveDex 12s linear infinite;
}

.dex-track img {
    width: 120px;
    margin: 0 80px;
    filter: drop-shadow(0 0 20px rgba(0,255,200,0.4));
    transition: transform 0.3s ease;
}

.dex-track img:hover {
    transform: scale(1.2);
}

@keyframes moveDex {
    from { transform: translateX(-100%); }
    to { transform: translateX(100%); }
}

.info {
    margin: 160px auto;
    line-height: 3;
    font-size: 1.3rem;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 60px;
    border-radius: 20px;
    max-width: 600px;
    backdrop-filter: blur(12px);
    box-shadow: 0 0 40px rgba(0,255,200,0.15);
}

.info p {
    margin: 20px 0;
}

.x-link img {
    width: 60px;
    margin-top: 140px;
    filter: drop-shadow(0 0 15px rgba(255,255,255,0.4));
    transition: transform 0.3s ease;
}

.x-link img:hover {
    transform: scale(1.2);
}

</style>
</head>
