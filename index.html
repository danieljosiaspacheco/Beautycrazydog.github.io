<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEAUTY Token</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
body {
    margin:0;
    font-family:'Orbitron', sans-serif;
    background: linear-gradient(135deg,#050505,#0a0a0a);
    color:white;
    overflow-x:hidden;
}

section {
    padding:120px 20px;
    text-align:center;
}

h1 {
    font-size:64px;
    margin-bottom:30px;
}

.subtitle {
    font-size:20px;
    max-width:700px;
    margin:40px auto;
    opacity:0.8;
    line-height:1.6;
}

.logo {
    width:220px;
    margin:60px auto;
    display:block;
    border-radius:20px;
}

.token-info {
    margin-top:60px;
    font-size:18px;
    line-height:2;
}

.contract {
    margin-top:20px;
    word-break:break-all;
    font-size:16px;
    opacity:0.8;
}

.buy-buttons {
    margin-top:80px;
    display:flex;
    justify-content:center;
    gap:60px;
    flex-wrap:wrap;
}

.buy-buttons img {
    width:140px;
    transition:0.4s;
}

.buy-buttons img:hover {
    transform:scale(1.2);
}

.x-link {
    margin-top:120px;
}

.x-link img {
    width:70px;
    transition:0.4s;
}

.x-link img:hover {
    transform:scale(1.3);
}

</style>
</head>
<body>

<section>
<h1>BEAUTY</h1>

<div class="subtitle">
The mission of this token is to show that even a memecoin can be scarcer than fiat currencies!
</div>

<img src="logo.png" class="logo">

<div class="token-info">
Supply: 2,000,000,000
<div class="contract">
Contract: GTXhHR7tDPA1tT4d4v45MTyhhYZUQycHK2t92C8Fpump
</div>
</div>

<div class="buy-buttons">
<a href="https://raydium.io" target="_blank">
<img src="https://cryptologos.cc/logos/raydium-ray-logo.png" alt="Raydium">
</a>

<a href="https://jup.ag" target="_blank">
<img src="https://cryptologos.cc/logos/jupiter-jup-logo.png" alt="Jupiter">
</a>
</div>

<div class="x-link">
<a href="https://x.com/Beutycrazydog" target="_blank">
<img src="https://abs.twimg.com/favicons/twitter.3.ico" alt="X">
</a>
</div>

</section>

</body>
</html>
