<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEAUTY</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f172a, #020617);
    color: white;
    text-align: center;
}
.container {
    padding: 80px 25px;
    max-width: 900px;
    margin: auto;
}
h1 {
    font-size: 64px;
    letter-spacing: 8px;
    margin-bottom: 20px;
}
.subtitle {
    font-size: 18px;
    opacity: 0.8;
    margin-bottom: 60px;
}
.card {
    background: rgba(255,255,255,0.05);
    padding: 40px;
    border-radius: 20px;
    backdrop-filter: blur(12px);
    box-shadow: 0 0 40px rgba(255,255,255,0.05);
    margin-bottom: 40px;
}
.links {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 40px;
}
.links img {
    width: 40px;
    transition: 0.3s;
}
.links img:hover {
    transform: scale(1.2);
}
.footer {
    margin-top: 80px;
    opacity: 0.5;
    font-size: 14px;
}
</style>
</head>
<body>
<div class="container">
<h1>BEAUTY</h1>
<p class="subtitle">The mission of this token is to show that even a memecoin can be scarcer than fiat currencies!</p>

<div class="card">
<p>Welcome to the BEAUTY ecosystem.</p>
</div>

<div class="links">
<a href="https://x.com/Beutycrazydog" target="_blank">
<img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="X">
</a>
</div>

<div class="footer">
© 2026 BEAUTY
</div>
</div>
</body>
</html>
